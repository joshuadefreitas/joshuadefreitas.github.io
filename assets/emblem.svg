<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">Joshua de Freitas operator emblem</title>
  <desc id="description">A platinum nonlinear response curve crossed by a transformed vector, with a displaced equilibrium point and a concealed JF monogram.</desc>
  <defs>
    <linearGradient id="platinum-response" x1="35" y1="91" x2="57" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#68707a"/>
      <stop offset="0.22" stop-color="#f7f8f8"/>
      <stop offset="0.46" stop-color="#929aa4"/>
      <stop offset="0.72" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#b8bdc4"/>
    </linearGradient>
    <linearGradient id="platinum-vector" x1="13" y1="28" x2="88" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#747c86"/>
      <stop offset="0.38" stop-color="#f7f8f9"/>
      <stop offset="0.62" stop-color="#a4aab2"/>
      <stop offset="1" stop-color="#eef0f2"/>
    </linearGradient>
  </defs>

  <!-- Named layers are deliberate: the mark can be refined without redrawing it. -->
  <g data-identity-mark="operator" data-monogram="jf">
    <g data-layer="response">
      <path d="M60 7C44 12 35 25 40 38c3 8 11 15 9 24-1 7-10 16-9 24 1 7 9 10 18 1l3-4c-5 14-18 17-27 9-9-9 1-24 8-34 4-6-1-13-6-20C28 24 37 10 60 7Z" fill="url(#platinum-response)"/>
      <path data-layer="laminae" d="M39.7 78.7c-1.4 6.1.8 10.2 6.6 12.2M41.8 75.6c-1.7 7.2.9 11.8 7.7 14" fill="none" stroke="#f8f9fa" stroke-opacity="0.58" stroke-width="0.65" stroke-linecap="round"/>
    </g>

    <g data-layer="vector" fill="url(#platinum-vector)">
      <path d="M12 27.8 66.2 63c4.7 3 7.7 6.3 9.6 10.5L88 91 77.9 72.5c-2.2-4.6-5.2-8-9.8-11L14.1 27Z"/>
    </g>

    <path data-layer="overpass" d="M47.2 47.5c1.1 1.8 2.1 3.7 2.8 5.5.8 2 .9 3.9.5 5.8l-5.2-3.4c.1-2-.6-4.1-1.7-6.3Z" fill="url(#platinum-response)"/>
    <path data-layer="equilibrium" d="m63.2 44.7 3.2 3.2-3.2 3.2-3.2-3.2Z" fill="#f7f8f9"/>
  </g>
</svg>
